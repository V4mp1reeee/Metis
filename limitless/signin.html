<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffdf8">
  <title>Sign in — Metis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <header class="auth-nav">
    <a class="brand" href="index.html"><img class="brand-logo" src="metis-logo.png" alt=""> Metis</a>
    <a href="signup.html">New to Metis? <strong>Join the crew</strong></a>
  </header>
  <main class="auth-layout">
    <section class="auth-story" aria-label="Get your crew together">
      <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1500&q=85" alt="Friends catching up together">
      <div class="auth-story-copy">
        <p class="kicker">Your crew is waiting</p>
        <h1>Less scrolling.<br>More stories.</h1>
        <p>Pick up where the group chat left off.</p>
      </div>
    </section>
    <section class="auth-form-wrap">
      <form class="auth-form" data-auth-form>
        <p class="kicker">Good to have you back</p>
        <h2>Sign in</h2>
        <p class="auth-intro">Your next plan is just around the corner.</p>
        <label for="signin-email">Email address</label>
        <input id="signin-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="signin-password">Password</label>
        <input id="signin-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        <button class="btn btn-fill auth-submit" type="submit">Sign in</button>
        <p class="auth-notice" data-auth-notice role="status" aria-live="polite">Account access isn't connected in this demo yet.</p>
        <p class="auth-switch">New around here? <a href="signup.html">Create an account</a></p>
      </form>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
